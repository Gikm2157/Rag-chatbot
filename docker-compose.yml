services:
  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
        TORCH_INDEX_URL: https://mirrors.nju.edu.cn/pytorch/whl/cpu
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./models:/app/models:ro
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis 的每次写入都会立即追加到磁盘文件；容器重启后可重放文件恢复数据。
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
